<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynasty Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Hanken+Grotesk:wght@400;600&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--side:#0e0e10;--panel:#131315;--line:#222226;--text:#ecebe6;--muted:#7d7d85;--gold:#e8b04a;--teal:#33c9a1;--red:#ef5b5b;--blue:#6ab0ff;--purple:#a78bfa;--mono:"JetBrains Mono",ui-monospace,monospace;--disp:"Barlow Condensed",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Hanken Grotesk",system-ui,sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:22px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font:700 20px var(--disp);letter-spacing:.08em;color:var(--gold);text-transform:uppercase;padding:0 10px}
.sub{color:var(--muted);font-size:12px;margin:2px 10px 14px}
#nav .g{font:600 11px var(--disp);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:18px 10px 6px}
#nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;color:#b9b9c0;padding:7px 10px;font:inherit;cursor:pointer}
#nav button:hover{background:#17171a}
#nav button.on{background:#1d1810;color:var(--gold)}
#nav select{width:calc(100% - 20px);margin:4px 10px 0}
main{padding:26px 32px 60px;max-width:1180px;width:100%}
h2{font:700 26px var(--disp);letter-spacing:.06em;text-transform:uppercase;margin:26px 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}
input,select,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
select{color:var(--gold);cursor:pointer}
input{flex:1 1 260px;border-radius:8px}
form{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
#f[hidden]{display:none}
button{cursor:pointer}
button.go{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:600}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;align-items:center}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid #1b1b1f;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font:600 12px var(--disp);letter-spacing:.12em;text-transform:uppercase;background:#101012}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:13px}
.w{color:var(--teal)}.l{color:var(--red)}.m{color:var(--muted)}.t{color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.card h3{margin:0 0 4px;font:700 20px var(--disp);letter-spacing:.04em}
.msg{color:var(--muted);padding:20px 0}.err{color:var(--red)}
.pb{font:600 11px var(--mono);padding:2px 7px;border-radius:4px;border:1px solid}
.p-QB{color:#ef5b5b;background:#2a1315;border-color:#5a2427}.p-RB{color:#33c9a1;background:#0f2620;border-color:#1e5a49}.p-WR{color:#6ab0ff;background:#101e2e;border-color:#23476e}.p-TE{color:#f08a3c;background:#2a1b10;border-color:#6a3d1a}.p-K{color:#a78bfa;background:#1c162e;border-color:#43357a}.p-DEF{color:#e8b04a;background:#261e0e;border-color:#5f4a1a}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.k{font:600 11px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sc .v{font:500 28px var(--mono);margin:4px 0 2px}.sc .s{font-size:12px;color:var(--muted)}
.v.gold{color:var(--gold)}.v.teal{color:var(--teal)}
.rf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.box{border-radius:12px;padding:14px 18px;border:1px solid}
.box h4{margin:0 0 8px;font:700 13px var(--disp);letter-spacing:.14em;text-transform:uppercase}
.up{background:#0d1f1a;border-color:#1e5a49}.up h4{color:var(--teal)}.dn{background:#1f0f10;border-color:#5a2427}.dn h4{color:var(--red)}
.box .s{font-size:12px;color:var(--muted);margin:-4px 0 8px}.trd{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}.trh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 16px;background:#101012;color:var(--muted);font:12px var(--mono);border-bottom:1px solid var(--line)}.trb{display:grid}.trs{padding:12px 16px;border-left:1px solid var(--line);min-width:0}.trs:first-child{border-left:0}.trt{margin-top:8px;padding-top:8px;border-top:1px solid #1b1b1f;font:600 15px var(--mono)}.srt{cursor:pointer;user-select:none}.srt:hover{color:var(--text)}th.on{color:var(--gold);background:#1a1710}.pg{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin:10px 0;font-family:var(--mono)}.srch{width:100%;max-width:320px;margin:0 0 12px;border-radius:8px}.pl{cursor:pointer;color:inherit}.pl:hover{text-decoration:underline;text-decoration-color:var(--gold)}
.md{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.md[hidden]{display:none}.mb{background:#101012;border:1px solid var(--line);border-radius:14px;width:min(540px,100%);max-height:90vh;overflow-y:auto;padding:22px;position:relative}.mx{position:absolute;top:12px;right:12px;padding:2px 10px}.mh h3{margin:0 0 4px;font:700 26px var(--disp);letter-spacing:.04em}.sg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sg3 .sc{padding:10px 12px}.sg3 .v{font-size:22px}.mt{margin:18px 0 6px}.k i{font:italic 13px "Instrument Serif",serif;text-transform:none;letter-spacing:0}.clk{cursor:pointer}.gl td{background:#0d0d0f;font-size:13px}
.bk{display:grid;gap:18px;overflow-x:auto}.bh{text-align:center;margin-bottom:8px}.bm{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}.bt{display:flex;gap:8px;align-items:center;padding:7px 10px}.bt.w{background:#1d1810;color:var(--gold)}.bt i{font:11px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}.bt span{flex:1}.bt b{font:500 13px var(--mono)}.bye{opacity:.5}.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#17171a;font:600 11px var(--mono);margin-right:8px}
.pill{border-radius:999px;border:1px solid #5f4a1a;background:#261e0e;color:var(--gold);padding:2px 12px;font-size:13px;cursor:pointer}.pill.off{opacity:.35}.gc{align-items:flex-end;gap:14px}.gc .k{margin-bottom:4px}.gf{background:#0f0f11;border:1px solid var(--line);border-radius:12px;padding:12px 12px 4px;margin:8px 0}.lg{display:flex;gap:16px;justify-content:center;font-size:13px;color:#c9c9d0;margin-bottom:6px}.lg i,.gtip i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}circle.dot{transition:r .1s}circle.dot:hover{r:8;stroke:#fff;stroke-width:1.5}.gtip{position:fixed;z-index:60;background:#0a0a0b;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:13px;pointer-events:none;min-width:190px;box-shadow:0 6px 20px rgba(0,0,0,.6)}.gtip[hidden]{display:none}.gtip b{display:block;margin-bottom:4px}.gtip .in{padding-left:16px;color:#c9c9d0}
@media(max-width:800px){.trb{grid-template-columns:1fr!important}.trs{border-left:0;border-top:1px solid var(--line)}}.rw{gap:12px;display:flex;justify-content:space-between;font-size:14px;padding:2px 0}.rw>span:last-child{font-family:var(--mono)}
.hd{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px}.hd h2{border:0;margin:0;padding:0;font-size:22px}.hd .sb{font:italic 14px "Instrument Serif",serif;color:var(--muted);flex:1}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ins{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:10px;padding:14px 16px;font-size:15px}
.ins .k{margin-bottom:6px}.ins b{color:var(--gold);font-weight:600}
.c-gold{border-left-color:var(--gold)}.c-purple{border-left-color:var(--purple)}.c-red{border-left-color:var(--red)}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto}main{padding:18px 14px}.rf{grid-template-columns:1fr}}
</style>

</head>
<body>
<div class="app">
<aside><div class="brand" id="title">The Archive</div><p class="sub" id="sub">Pulled live from Sleeper</p><div id="nav"></div></aside>
<main>
  <form id="f">
    <input id="lid" value="1334753181237772288" aria-label="Sleeper league ID" inputmode="numeric">
    <button class="go">Load archive</button>
  </form>
  <div id="view"><p class="msg">Press “Load archive” to pull your league’s full history.</p></div>
</main>
</div>
<div id="md" class="md" hidden><div class="mb"><button class="mx" data-x aria-label="Close">✕</button><div id="mc"></div></div></div>
<script>
const API="https://api.sleeper.app/v1",$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const j=u=>fetch(API+u).then(r=>{if(!r.ok)throw new Error(r.status+" on "+u);return r.json()});
let S=[],names={},players=null,tab="dashboard",nk="dashboard",ME=null;
const NAV=[["Home",[["dashboard","Dashboard"]]],["My team",[["myscoring","My Scoring"],["myh2h","My H2H"],["mydash","My Dashboard"],["mydraft","My Draft"],["mytrades","My Trades"]]],["League",[["scoring","Player Scoring"],["graphs","Player Graphs"],["standings","Standings"],["h2h","H2H"],["draft","Draft"],["trades","Trades"],["playoffs","Playoffs"],["pscoring","Playoff Scoring"],["champions","Champions"],["matchups","Matchups"],["records","Records"],["hof","Hall of Fame"]]]];

$("#f").addEventListener("submit",e=>{e.preventDefault();load($("#lid").value.trim())});

async function load(id){
  const v=$("#view");v.innerHTML='<p class="msg">Loading league history…</p>';
  try{
    const leagues=[];
    while(id&&id!=="0"){const l=await j("/league/"+id);leagues.push(l);id=l.previous_league_id}
    S=await Promise.all(leagues.map(async l=>{
      const L=l.league_id,ps=l.settings.playoff_week_start||15;
      const [users,rosters,bracket,drafts,...wk]=await Promise.all([
        j(`/league/${L}/users`),j(`/league/${L}/rosters`),
        j(`/league/${L}/winners_bracket`).catch(()=>[]),j(`/league/${L}/drafts`).catch(()=>[]),
        ...Array.from({length:18},(_,i)=>j(`/league/${L}/matchups/${i+1}`).catch(()=>[]))]);
      const um={};users.forEach(u=>um[u.user_id]=u);
      const own={};rosters.forEach(r=>{own[r.roster_id]=r.owner_id;const u=um[r.owner_id];if(u)names[r.owner_id]=u.metadata?.team_name?`${u.display_name}`:u.display_name});
      const games=[],starts=[],brk=new Set();(bracket||[]).filter(m=>m.w&&m.l&&(!m.p||m.p===1)).forEach(m=>[m.w,m.l].forEach(r=>brk.add((ps+m.r-1)+"|"+own[r])));
      wk.forEach((d,i)=>{const g={};(d||[]).forEach(m=>{if(m.matchup_id!=null){(g[m.matchup_id]??=[]).push(m);if(m.points>0)(m.starters||[]).forEach(p=>{const pt=m.players_points?.[p];if(p&&p!=="0"&&pt!=null)starts.push({y:l.season,w:i+1,reg:i+1<ps,pid:p,pts:pt,o:own[m.roster_id],br:brk.has((i+1)+"|"+own[m.roster_id])})})}});
        Object.values(g).forEach(p=>{if(p.length===2&&(p[0].points||p[1].points))games.push({w:i+1,reg:i+1<ps,a:own[p[0].roster_id],b:own[p[1].roster_id],pa:p[0].points,pb:p[1].points,br:brk.has((i+1)+"|"+own[p[0].roster_id])&&brk.has((i+1)+"|"+own[p[1].roster_id])})})});
      return {year:l.season,id:L,name:l.name,own,rosters,bracket,drafts,games,starts,brk,ps};
    }));
    S.sort((a,b)=>a.year-b.year);SI=null;PK=null;RKM=null;
    $("#title").textContent=leagues[0].name+" Archive";
    $("#sub").textContent=`${S.length} season${S.length>1?"s":""}, ${S[0].year}–${S.at(-1).year}. Pulled live from Sleeper.`;
    try{ME=localStorage.getItem("me")}catch{}
    if(!names[ME])ME=Object.keys(names)[0];
    $("#f").hidden=true;tab=nk="dashboard";
    const nav=$("#nav");
    nav.innerHTML=`<div class="g">Select your manager</div><select id="me">${mOpts().map(([k,l])=>`<option value="${esc(k)}"${k===ME?" selected":""}>${esc(l)}</option>`).join("")}</select>`+NAV.map(([g,l])=>`<div class="g">${g}</div>`+l.map(([k,n])=>`<button data-k="${k}">${n}</button>`).join("")).join("");
    nav.onclick=e=>{const b=e.target.closest("button");if(!b)return;nk=tab=b.dataset.k;if(nk==="myscoring"){tab="scoring";PV.o=ME;PV.y="all";PV.ph="all"}else if(nk==="pscoring"){tab="scoring";PV.o="all";PV.ph="br"}else if(nk==="scoring"){PV.o="all";PV.ph="all"}else if(nk==="myh2h"){tab="h2h";HV.a=ME}show()};
    $("#me").onchange=e=>{ME=e.target.value;try{localStorage.setItem("me",ME)}catch{}if(nk==="myscoring")PV.o=ME;if(nk==="myh2h")HV.a=ME;show()};
    show();
  }catch(e){v.innerHTML=`<p class="err">Couldn’t load that league: ${esc(e.message)}. Check the league ID and try again.</p>`}
}
const N=o=>esc(names[o]||"Unknown");
const sel=(id,opts,val)=>`<select id="${id}">${opts.map(([k,l])=>`<option value="${k}"${k==val?" selected":""}>${esc(l)}</option>`).join("")}</select>`;
const yearOpts=all=>[...(all?[["all","All-time"]]:[]),...S.slice().reverse().map(s=>[s.year,s.year])];

function show(){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.k===nk));
  ({dashboard,mydash,mydraft,mytrades,playoffs,standings,champions,scoring,graphs,matchups,h2h,records,draft,trades,hof})[tab]();
  scrollTo(0,0)
}
const pb=p=>`<span class="pb p-${esc(p)}">${esc(p)}</span>`;
const stand=s=>{const r={};s.games.filter(g=>g.reg).forEach(g=>{[[g.a,g.pa,g.pb],[g.b,g.pb,g.pa]].forEach(([o,p,q])=>{const x=r[o]??={w:0,l:0,t:0,pf:0,n:0};x.pf+=p;x.n++;p>q?x.w++:p<q?x.l++:x.t++})});return Object.entries(r).sort((a,b)=>b[1].w-a[1].w||b[1].pf-a[1].pf)};
const rk=(cur,w)=>{const m={};cur.starts.filter(x=>x.w<=w).forEach(x=>m[x.pid]=(m[x.pid]||0)+x.pts);const r={};Object.entries(m).sort((a,b)=>b[1]-a[1]).forEach(([p],i)=>r[p]=i+1);return r};
async function dashboard(){
  $("#view").innerHTML='<p class="msg">Loading player data…</p>';
  try{await loadPlayers()}catch(e){$("#view").innerHTML=`<p class="err">${esc(e.message)}</p>`;return}
  const f1=x=>x.toFixed(1),g=h=>`<b>${h}</b>`;
  const cur=S.at(-1),st=stand(cur),mi=st.findIndex(([o])=>o===ME),me=st[mi]?.[1],ld=st[0];
  const W=Math.max(0,...cur.starts.map(x=>x.w)),top=cur.starts.filter(x=>x.w===W).sort((a,b)=>b.pts-a.pts)[0],ti=top&&PI(top.pid);
  const dc=S.slice().reverse().map(s=>[s.year,champOf(s)]).find(x=>x[1]);
  const card=(k,v,s,c="")=>`<div class="sc"><div class="k">${k}</div><div class="v ${c}">${v}</div><div class="s">${s}</div></div>`;
  let rf="";
  if(W>=2){const a=rk(cur,W),b=rk(cur,W-1),d=Object.keys(a).filter(p=>b[p]).map(p=>({p,d:b[p]-a[p]})).sort((x,y)=>y.d-x.d);
    const li=(l,c,sg)=>l.map(x=>`<div class="rw"><span>${esc(PI(x.p).nm)} <span class="m">#${b[x.p]} → #${a[x.p]}</span></span><span class="${c}">${sg}${Math.abs(x.d)}</span></div>`).join("")||'<div class="m">None</div>';
    rf=`<div class="rf"><div class="box up"><h4>↑ Risers — Week ${W}</h4><div class="s">Biggest rank gains in total ${cur.year} points as a starter</div>${li(d.filter(x=>x.d>0).slice(0,4),"w","+")}</div><div class="box dn"><h4>↓ Fallers — Week ${W}</h4><div class="s">Biggest rank drops in total ${cur.year} points as a starter</div>${li(d.filter(x=>x.d<0).slice(-4).reverse(),"l","-")}</div></div>`}
  const all=agg(()=>true).map(a=>({...a,...PI(a.pid)})).sort((x,y)=>y.tot-x.tot);
  const I=[];
  if(all[0])I.push(["All-time league leader","",`${g(plk(all[0].pid,all[0].nm))} (${esc(all[0].pos)}) leads all-time with ${g(f1(all[0].tot)+" pts")} across ${all[0].n} starts, ${f1(all[0].tot/all[0].n)} per game.`]);
  ["QB","RB","WR","TE"].forEach(P=>{const[a,c]=all.filter(x=>x.pos===P);if(a)I.push([`Top ${P} all-time`,"",`${g(plk(a.pid,a.nm))} is the highest-scoring ${P} in league history with ${g(f1(a.tot)+" pts")} in ${a.n} starts.${c?` Runner-up: ${esc(c.nm)} (${f1(c.tot)} pts).`:""}`])});
  const rec={};S.forEach(s=>stand(s).forEach(([o,x])=>{const r=rec[o]??={w:0,l:0,t:0,pf:0,n:0};for(const k in x)r[k]+=x[k]}));
  const R=Object.entries(rec);
  const bp=R.slice().sort((a,b)=>b[1].w/(b[1].w+b[1].l+b[1].t)-a[1].w/(a[1].w+a[1].l+a[1].t))[0];
  if(bp)I.push(["Best all-time record","c-gold",`${g(N(bp[0]))} leads all managers with ${bp[1].w}–${bp[1].l}${bp[1].t?"–"+bp[1].t:""} (${(bp[1].w/(bp[1].w+bp[1].l+bp[1].t)*100).toFixed(0)}% win rate).`]);
  const hp=R.slice().sort((a,b)=>b[1].pf-a[1].pf)[0];
  if(hp)I.push(["Highest scoring manager","c-gold",`${g(N(hp[0]))} has scored the most points: ${g(Math.round(hp[1].pf).toLocaleString())} total (${f1(hp[1].pf/hp[1].n)} PPG).`]);
  const pr={};S.forEach(s=>s.games.filter(x=>x.reg&&x.pa!==x.pb).forEach(x=>{const[w,l]=x.pa>x.pb?[x.a,x.b]:[x.b,x.a];(pr[w+"|"+l]??=[0,0])[0]++;(pr[l+"|"+w]??=[0,0])[1]++}));
  const rv=Object.entries(pr).filter(([,v])=>v[0]+v[1]>=4).sort((a,b)=>(b[1][0]-b[1][1])-(a[1][0]-a[1][1]))[0];
  if(rv){const[a,b]=rv[0].split("|");I.push(["Most lopsided rivalry","c-purple",`${g(N(a))} dominates ${g(N(b))} head-to-head with a ${rv[1][0]}–${rv[1][1]} record in loaded seasons.`])}
  const bs=S.flatMap(s=>s.starts).sort((a,b)=>b.pts-a.pts)[0];
  if(bs)I.push(["Highest single-game score","c-red",`${g(plk(bs.pid,PI(bs.pid).nm))} (${esc(PI(bs.pid).pos)}) holds the record: ${g(f1(bs.pts)+" pts")} in week ${bs.w} of ${bs.y} for ${N(bs.o)}.`]);
  const ag=S.flatMap(s=>s.games.map(x=>({...x,y:s.year})));
  const ht=ag.flatMap(x=>[{o:x.a,p:x.pa,x},{o:x.b,p:x.pb,x}]).sort((a,b)=>b.p-a.p)[0];
  if(ht)I.push(["Highest team score","c-red",`${g(N(ht.o))} scored ${g(f1(ht.p)+" pts")} in week ${ht.x.w} of ${ht.x.y}.`]);
  const bo=ag.map(x=>({x,d:Math.abs(x.pa-x.pb)})).sort((a,b)=>b.d-a.d)[0];
  if(bo)I.push(["Biggest blowout","c-red",`${g(N(bo.x.pa>bo.x.pb?bo.x.a:bo.x.b))} won by ${g(f1(bo.d))} over ${N(bo.x.pa>bo.x.pb?bo.x.b:bo.x.a)} in week ${bo.x.w} of ${bo.x.y}.`]);
  const tc={};S.forEach(s=>{const c=champOf(s);if(c)tc[c]=(tc[c]||0)+1});
  const tt=Object.entries(tc).sort((a,b)=>b[1]-a[1])[0];

const ord=n=>n+({1:"st",2:"nd",3:"rd"}[n]||"th");
const isRk=d=>(d.settings?.rounds||0)<=7&&d.type!=="auction";
const loadTx=async s=>TXC[s.id]??=(await Promise.all(Array.from({length:19},(_,i)=>j(`/league/${s.id}/transactions/${i}`).catch(()=>[])))).flat().filter(t=>t.type==="trade"&&t.status==="complete");
const DF={};
const fullDraft=async d=>DF[d.draft_id]??=(d.slot_to_roster_id&&Object.keys(d.slot_to_roster_id).length?d:{...d,...(await j("/draft/"+d.draft_id).catch(()=>({})))});
async function pickItem(d){
  const lab=`${d.season} ${ord(d.round)} Pick`;
  const cs=S.flatMap(x=>x.drafts.map(dd=>({dd,x}))).filter(c=>String(c.dd.season)===String(d.season)&&c.dd.type!=="auction").sort((a,b)=>isRk(b.dd)-isRk(a.dd));
  if(!cs.length)return{nm:lab,pts:0};
  let why="";
  for(const{dd:d0,x}of cs){
    const dd=await fullDraft(d0);
    let map=dd.slot_to_roster_id||{};
    if(!Object.keys(map).length&&dd.draft_order){map={};Object.entries(dd.draft_order).forEach(([u,sl])=>{const r=x.rosters.find(q=>q.owner_id===u);if(r)map[sl]=r.roster_id})}
    const slot=Object.entries(map).find(([,r])=>r==d.roster_id)?.[0];
    if(slot==null){why=Object.keys(map).length?`roster ${d.roster_id} missing from draft order`:"draft has no order data";continue}
    const picks=await picksOf(d0);
    if(!picks.length){why="draft has no picks";continue}
    const n=dd.settings?.teams||Object.keys(map).length,sl=+slot;
    const pn=(dd.type==="snake"&&d.round%2===0)?(d.round-1)*n+(n-sl+1):(d.round-1)*n+sl;
    const pk=picks.find(k=>k.round==d.round&&k.player_id&&(k.draft_slot!=null?String(k.draft_slot)===String(slot):k.pick_no==pn));
    if(pk)return{pid:pk.player_id,nm:`${lab} (${PI(pk.player_id).nm})`,pts:ptsFrom(pk.player_id,x.own[pk.roster_id],x.year,0)};
    why=`no pick found for slot ${slot}, round ${d.round}`;
  }
  return{nm:`${lab} (${cs.some(c=>c.dd.status==="complete")?"pick not matched: "+why:"not yet drafted"})`,pts:0};
}
const SORT=[["recent","Most recent"],["comb","Most combined pts"],["win","Most pts (winning side)"],["lose","Most pts (losing side)"]];
let TV={y:"all",o:"all",sort:"recent"},TM={y:"all",sort:"recent"};
async function trades(my){
  const V=my?TM:TV,f1=x=>x.toFixed(1);
  $("#view").innerHTML='<p class="msg">Loading trades and calculating points…</p>';
  try{
    await loadPlayers();sIdx();
    let rows=[];
    for(const s of S){if(V.y!=="all"&&s.year!=V.y)continue;
      for(const t of await loadTx(s)){
        const sides=await Promise.all(t.roster_ids.map(async r=>{const o=s.own[r],items=[];
          Object.entries(t.adds||{}).filter(([,x])=>x===r).forEach(([pid])=>items.push({pid,nm:PI(pid).nm,pts:ptsFrom(pid,o,s.year,t.leg)}));
          for(const d of(t.draft_picks||[]).filter(d=>d.owner_id===r))items.push(await pickItem(d));
          return{o,items,tot:items.reduce((n,x)=>n+x.pts,0)}}));
        rows.push({y:s.year,w:t.leg,c:t.created,sides,comb:sides.reduce((n,x)=>n+x.tot,0)})}}
    const who=my?ME:V.o;if(who!=="all")rows=rows.filter(t=>t.sides.some(s=>s.o===who));
    const mx=t=>Math.max(...t.sides.map(s=>s.tot)),mn=t=>Math.min(...t.sides.map(s=>s.tot));
    rows.sort(({recent:(a,b)=>b.c-a.c,comb:(a,b)=>b.comb-a.comb,win:(a,b)=>mx(b)-mx(a),lose:(a,b)=>mn(b)-mn(a)})[V.sort]);
    const card=t=>{const M=mx(t),tie=t.sides.every(s=>s.tot===M);
      return`<div class="trd"><div class="trh"><span>${t.y} · Week ${t.w}</span><span>${t.sides.map(s=>N(s.o)).join(" ↔ ")}</span><span>${f1(t.comb)} combined pts</span></div><div class="trb" style="grid-template-columns:repeat(${t.sides.length},1fr)">${t.sides.map(s=>{const w=!tie&&s.tot===M;return`<div class="trs"><div class="k">${N(s.o)} received${my&&s.o===ME?" (you)":""}</div>${s.items.map(i=>`<div class="rw"><span>${i.pid?plk(i.pid,i.nm):esc(i.nm)}</span><span class="m">${i.pts?f1(i.pts)+" pts":"–"}</span></div>`).join("")||'<div class="rw"><span class="m">Nothing</span></div>'}<div class="trt ${tie?"m":w?"t":"l"}">${f1(s.tot)} pts${my?"":" total"}${w?" ✓":""}</div></div>`}).join("")}</div></div>`};
    $("#view").innerHTML=`<div class="hd"><h2>${my?"My trades":"Trades"}</h2><span class="sb">${my?"All trades involving your roster":"Post-trade value extracted (pts scored after trade)"}</span></div>${bar(V,[["y",sOpts()],...(my?[]:[["o",oOpts()]]),["sort",SORT]])}${rows.map(card).join("")||'<p class="msg">No trades found.</p>'}<p class="m">Points count what each player scored in the receiving manager’s starting lineups from the trade week onward. A traded pick shows the player it became (points scored for the team that drafted him), or – if the draft hasn’t happened.</p>`;
    wire(V,()=>trades(my));
  }catch(e){$("#view").innerHTML=`<p class="err">Couldn’t load trades: ${esc(e.message)}</p>`}
}
const mytrades=()=>trades(true);
let MD={st:"0"};
async function mydraft(){
  $("#view").innerHTML='<p class="msg">Loading draft history…</p>';
  try{await loadPlayers();sIdx();
    const f1=x=>x.toFixed(1),rk=[],ud=[];
    for(const s of S)for(const d of s.drafts){const au=d.type==="auction",st=!au&&!isRk(d);if(st&&MD.st!=="1")continue;
      for(const k of await picksOf(d)){if(s.own[k.roster_id]!==ME||!k.player_id)continue;
        const h=(SI[k.player_id+"|"+ME]||[]).filter(x=>x.y>=s.year),I=PI(k.player_id);
        (au?ud:rk).push({pid:k.player_id,y:s.year,nm:`${k.metadata?.first_name||I.nm} ${k.metadata?.last_name||""}`.trim(),pos:k.metadata?.position||I.pos,acq:st?"Startup":"Rd "+k.round,bid:+(k.metadata?.amount||0),pts:h.reduce((n,x)=>n+x.pts,0),n:h.length})}}
    const all=[...rk,...ud].sort((a,b)=>b.pts-a.pts||b.y-a.y),pc={};all.forEach(r=>pc[r.pos]=(pc[r.pos]||0)+1);
    const top=all.filter(r=>r.pts>0).slice(0,3),zero=all.filter(r=>!r.n).sort((a,b)=>b.y-a.y).slice(0,3);
    const li=(l,c)=>l.map(r=>`<div class="rw"><span>${plk(r.pid,r.nm)} <span class="m">${r.y}</span></span><span class="${c}">${Math.round(r.pts)}</span></div>`).join("")||'<div class="m">None</div>';
    const base=[{k:"y",l:"Year",v:r=>r.y,h:r=>`<span class="m">${r.y}</span>`},{k:"nm",l:"Player",v:r=>r.nm.toLowerCase(),h:r=>plk(r.pid,r.nm)},{k:"pos",l:"Pos",v:r=>r.pos,h:r=>pb(r.pos)}];
    const tail=[{k:"pts",l:"Pts for you",n:1,v:r=>r.pts,h:r=>r.n?f1(r.pts):"–"},{k:"n",l:"Starts",n:1,v:r=>r.n,h:r=>r.n||"–"},{k:"pl",l:"Played",v:r=>r.n?1:0,h:r=>r.n?"✓":""}];
    $("#view").innerHTML=`<div class="hd"><h2>My draft history</h2><span class="sb">All picks made by ${N(ME)} · pts scored for your team</span></div><div class="bar">${sel("v_st",[["0","Rookie drafts + UDFA"],["1","Include startup draft"]],MD.st)}</div><div class="bar">${Object.entries(pc).sort((a,b)=>b[1]-a[1]).map(([p,n])=>`<span class="pb p-${esc(p)}">${esc(p)}: ${n}</span>`).join("")}</div><div class="rf"><div class="box up"><h4>Top picks by pts</h4>${li(top,"w")}</div><div class="box dn"><h4>No pts scored</h4>${li(zero,"l")}</div></div>
    <h2>Linear draft picks</h2>${sTable("myrk",[...base,{k:"acq",l:"Acq.",v:r=>r.acq,h:r=>`<span class="m">${r.acq}</span>`},...tail],rk,{k:"pts"})}
    <h2>UDFA auction</h2>${ud.length?sTable("myud",[...base,{k:"bid",l:"Bid",n:1,v:r=>r.bid,h:r=>`<span class="t">$${r.bid}</span>`},...tail],ud,{k:"pts"}):'<p class="msg">No UDFA auction picks found on Sleeper yet. They can be added later from your own log.</p>'}`;
    wire(MD,mydraft);
  }catch(e){$("#view").innerHTML=`<p class="err">${esc(e.message)}</p>`}
}
async function hof(){
  $("#view").innerHTML='<p class="msg">Loading…</p>';
  try{
    const x=await fetch("extras.json").then(r=>{if(!r.ok)throw 0;return r.json()});
    $("#view").innerHTML=(x.hallOfFame||[]).map(h=>`<div class="card"><h3>${esc(h.name)}</h3><span class="t">${esc(h.years||"")}</span><div>${esc(h.blurb||"")}</div></div>`).join("")||'<p class="msg">No entries yet.</p>';
  }catch{
    $("#view").innerHTML='<p class="msg">Add an <b>extras.json</b> file next to index.html to fill this in. Format: {"hallOfFame":[{"name":"…","years":"2019–2023","blurb":"…"}]}</p>';
  }
}
